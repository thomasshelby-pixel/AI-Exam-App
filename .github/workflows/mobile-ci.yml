name: Mobile app CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: TypeScript check
        run: npm run typecheck
      - name: Expo config validation
        run: npx expo config --type public
      - name: Android bundle export
        run: npx expo export --platform android

  android-apk:
    needs: typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install dependencies
        run: npm install
      - name: Align Expo SDK dependencies
        run: npx expo install --fix
      - name: Generate Android native project
        run: CI=1 npx expo prebuild --platform android --no-install
      - name: Diagnose Expo publication metadata
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const root = path.resolve('node_modules');
          let configs = 0;
          let suspects = 0;
          function scan(value, file, trail = '$') {
            if (!value || typeof value !== 'object') return;
            for (const [key, child] of Object.entries(value)) {
              const next = `${trail}.${key}`;
              if (key === 'publication' && child && typeof child === 'object' && !('version' in child)) {
                console.log(`PUBLICATION_WITHOUT_VERSION: ${file} at ${next}: ${JSON.stringify(child)}`);
                suspects++;
              }
              scan(child, file, next);
            }
          }
          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              if (entry.name === '.cache') continue;
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(full);
              else if (entry.name === 'expo-module.config.json') {
                configs++;
                try { scan(JSON.parse(fs.readFileSync(full, 'utf8')), path.relative(root, full)); }
                catch (error) { console.log(`INVALID_CONFIG: ${path.relative(root, full)}: ${error.message}`); }
              }
            }
          }
          walk(root);
          console.log(`Scanned ${configs} Expo module config files; found ${suspects} publication object(s) without version.`);
          NODE
      - name: Build installable debug APK
        run: cd android && ./gradlew assembleDebug
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: ai-exam-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
