name: Mobile app CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: TypeScript check
        run: npm run typecheck
      - name: Expo config validation
        run: npx expo config --type public
      - name: Android bundle export
        run: npx expo export --platform android

  android-apk:
    needs: typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install dependencies
        run: npm install
      - name: Generate Android native project
        run: CI=1 npx expo prebuild --platform android --no-install
      - name: Diagnose Expo publication metadata
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const root = path.resolve('node_modules');
          let configs = 0;
          let suspects = 0;
          function scan(value, file, trail = '$') {
            if (!value || typeof value !== 'object') return;
            for (const [key, child] of Object.entries(value)) {
              const next = `${trail}.${key}`;
              if (key === 'publication' && child && typeof child === 'object' && !('version' in child)) {
                console.log(`PUBLICATION_WITHOUT_VERSION: ${file} at ${next}: ${JSON.stringify(child)}`);
                suspects++;
              }
              scan(child, file, next);
            }
          }
          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              if (entry.name === '.cache') continue;
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(full);
              else if (entry.name === 'expo-module.config.json') {
                configs++;
                try { scan(JSON.parse(fs.readFileSync(full, 'utf8')), path.relative(root, full)); }
                catch (error) { console.log(`INVALID_CONFIG: ${path.relative(root, full)}: ${error.message}`); }
              }
            }
          }
          walk(root);
          console.log(`Scanned ${configs} Expo module config files; found ${suspects} publication object(s) without version.`);
          NODE
      - name: Build standalone release APK with embedded JS bundle
        id: build_release_apk
        run: cd android && ./gradlew assembleRelease
      - name: Launch APK in Android emulator and capture crash logs
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb install -r android/app/build/outputs/apk/release/app-release.apk
            adb logcat -c
            adb shell monkey -p com.caexamchecker.aiapp -c android.intent.category.LAUNCHER 1
            sleep 15
            adb logcat -d -t 5000 > /tmp/ai-exam-launch-log.txt
            echo "=== App process ==="
            adb shell pidof com.caexamchecker.aiapp || true
            echo "=== Foreground activity ==="
            adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity' || true
            echo "=== Relevant launch / crash log lines ==="
            grep -E 'FATAL EXCEPTION|Fatal signal|ReactNativeJS|AndroidRuntime|Process: com.caexamchecker.aiapp|Unable to load script|com.caexamchecker.aiapp' /tmp/ai-exam-launch-log.txt | tail -n 200 || true
            if grep -Eq 'FATAL EXCEPTION|Fatal signal' /tmp/ai-exam-launch-log.txt; then echo "Android runtime crash detected during app launch."; exit 1; fi
            test -n "$(adb shell pidof com.caexamchecker.aiapp)" || { echo "App process exited after launch; see the launch logs above."; exit 1; }
      - name: Prepare user-friendly APK filename
        if: ${{ always() && steps.build_release_apk.outcome == 'success' }}
        run: cp android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/apk/release/CA-Exam-Checker-AI.apk
      - name: Upload standalone Android APK
        if: ${{ always() && steps.build_release_apk.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: CA-Exam-Checker-AI
          path: android/app/build/outputs/apk/release/CA-Exam-Checker-AI.apk
          if-no-files-found: error
          retention-days: 7
