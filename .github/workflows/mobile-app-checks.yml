name: Mobile App Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "fix/mobile-production-api-config"]
  workflow_dispatch:

jobs:
  android-release-apk:
    name: SDK 58 checks and standalone Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37 build-tools;37.0.0'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Expo dependency compatibility check
        run: npx expo install --check

      - name: Expo Doctor
        run: npx expo-doctor@latest

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Android JavaScript bundle export
        run: npx expo export --platform android

      - name: Generate Android project
        run: npx expo prebuild --platform android --non-interactive

      - name: Build standalone release APK with bundled JavaScript
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Upload standalone release APK
        uses: actions/upload-artifact@v4
        with:
          name: ca-exam-checker-ai-standalone-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
